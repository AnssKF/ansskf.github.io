<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    SEO FALLBACKS: crawlers read these before JS runs.
    resume.json is the single source of truth; syncMeta() in js/app.js
    overwrites them at runtime. Keep in sync manually only when basics change.
  -->
  <meta name="description" content="Anss Khaled Farouk — Senior Software Engineer specialising in Ruby on Rails, ReactJS, and full-stack web development. Portfolio and contact." />
  <meta name="robots" content="index, follow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F3EEE4" />
  <!-- Theme before first paint (no flash): saved choice, else the OS setting. Kept in sync by js/app.js. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var t = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#161513' : '#F3EEE4');
    })();
  </script>
  <title>Anss Khaled — Senior Software Engineer</title>

  <link rel="canonical" href="https://anssk.me" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <meta property="og:type"        content="profile" />
  <meta property="og:title"       content="Anss Khaled — Senior Software Engineer" />
  <meta property="og:description" content="Senior Software Engineer specialising in Ruby on Rails, ReactJS, and full-stack web development." />
  <meta property="og:url"         content="https://anssk.me" />
  <meta property="og:locale"      content="en_US" />
  <meta property="og:image"       content="https://anssk.me/assets/og.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"    content="Anss Khaled Farouk drawn in ink dots on warm paper, with a handwritten signature." />
  <meta property="profile:first_name" content="Anss" />
  <meta property="profile:last_name"  content="Khaled" />

  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Anss Khaled — Senior Software Engineer" />
  <meta name="twitter:description" content="Senior Software Engineer specialising in Ruby on Rails, ReactJS, and full-stack web development." />
  <meta name="twitter:image"       content="https://anssk.me/assets/og.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Anss Khaled Farouk",
    "alternateName": "Anss Khaled",
    "url": "https://anssk.me",
    "email": "anss.khaled00@gmail.com",
    "telephone": "+20 1016329993",
    "jobTitle": "Senior Software Engineer",
    "description": "Software Engineer with expertise in building robust and scalable front-end and back-end systems.",
    "sameAs": [
      "https://www.linkedin.com/in/ansskfarouk/",
      "https://github.com/AnssKF"
    ],
    "worksFor": { "@type": "Organization", "name": "Pixelogic Media" }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400&display=swap" />
  <link rel="stylesheet" href="css/site.css" />


  <!-- Order matters: main.js (module, deferred) registers Alpine components on `alpine:init`, so it must come before Alpine. -->
  <script type="module" src="js/main.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="site">
  <canvas id="field" aria-hidden="true"></canvas>
  <noscript><p class="noscript">This site draws itself with JavaScript. The plain version lives in <a href="resume.json">resume.json</a>.</p></noscript>

  <main class="page" x-ref="page" x-cloak>
    <svg class="ink" x-ref="ink" aria-hidden="true">
      <defs>
        <mask id="ink-mask" maskUnits="userSpaceOnUse">
          <path class="ink-mask" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
        </mask>
      </defs>
      <path class="ink-measure" fill="none" stroke="none"/>
      <path class="ink-body" mask="url(#ink-mask)"/>
      <g class="ink-blots"></g>
      <circle class="ink-nib" r="3.2" cx="-10" cy="-10"/>
    </svg>

    <!-- LANDMARK: hero. Every [data-section] with an id is a hash route (#home). The name itself is drawn by the dot field. -->
    <header class="hero" id="home" data-section>
      <h1 class="sr-only" x-text="r.basics.name"></h1>
      <p class="label mono" x-text="[r.basics.label, place].filter(Boolean).join(' · ')"></p>
      <p class="summary" :class="{ go: ready }" :aria-label="r.basics.summary">
        <template x-for="(w, i) in words" :key="i">
          <span class="w" :style="`--i:${i}`" x-text="w" aria-hidden="true"></span>
        </template>
      </p>
      <p class="hint mono" :class="{ go: ready }" :style="`animation-delay:${hintDelay}ms`">scroll, I'll draw you the rest</p>
      <span class="ink-start" data-ink="start"></span>
    </header>

    <!--
      SECTIONS: one loop renders every entry of js/config/sections.js.
      Common chrome (hash route, heading, copy-link icon, ink-line node) is here once; the body is chosen by `s.view`.
      To add a view: copy one of the <template x-if> blocks below and change the condition.
    -->
    <template x-for="s in sections" :key="s.id">
      <section :id="s.id" class="sec" data-section>
        <header class="sec-head" data-ink>
          <p class="key mono" x-text="s.key"></p>
          <h2 x-anchor="s.id"><span x-text="s.title"></span></h2>
        </header>

        <!-- view: work (work[]) -->
        <template x-if="s.view === 'work'">
          <div>
            <template x-for="(job, i) in r.work" :key="i">
              <article class="entry reveal" data-ink>
                <p class="meta mono">
                  <span x-text="range(job) || 'on and off'"></span>
                  <span x-show="duration(job)" x-text="duration(job)"></span>
                </p>
                <h3 x-text="job.position"></h3>
                <p class="org">
                  <template x-if="job.url"><a :href="job.url" target="_blank" rel="noopener" x-text="job.name"></a></template>
                  <template x-if="!job.url"><span x-text="job.name"></span></template>
                </p>
                <p class="sum" x-show="job.summary" x-text="job.summary"></p>
                <ul class="hl">
                  <template x-for="(h, k) in shown(job)" :key="k"><li x-text="h"></li></template>
                </ul>
                <template x-if="hidden(job) > 0">
                  <div>
                    <div class="more" :class="{ open: open['work-' + i] }" :id="`more-${i}`">
                      <div>
                        <ul class="hl">
                          <template x-for="(h, k) in rest(job)" :key="k"><li :style="`--k:${k}`" x-text="h"></li></template>
                        </ul>
                      </div>
                    </div>
                    <button class="more-btn mono" type="button" @click="open['work-' + i] = !open['work-' + i]"
                            :aria-expanded="!!open['work-' + i]" :aria-controls="`more-${i}`"
                            x-text="open['work-' + i] ? 'fold it back up' : `+${hidden(job)} more I'm proud of`"></button>
                  </div>
                </template>
              </article>
            </template>
          </div>
        </template>

        <!-- view: projects (projects[]) -->
        <template x-if="s.view === 'projects'">
          <div class="cards" :class="{ solo: r.projects.length === 1 }">
            <template x-for="(p, i) in r.projects" :key="i">
              <article class="card reveal" data-ink>
                <p class="meta mono" x-show="p.type || p.startDate" x-text="[p.type, range(p)].filter(Boolean).join(' · ')"></p>
                <h3>
                  <template x-if="p.url"><a :href="p.url" target="_blank" rel="noopener" x-text="p.name"></a></template>
                  <template x-if="!p.url"><span x-text="p.name"></span></template>
                </h3>
                <p x-text="p.description"></p>
                <ul class="hl" x-show="list(p.highlights).length">
                  <template x-for="(h, k) in list(p.highlights)" :key="k"><li x-text="h"></li></template>
                </ul>
                <p class="tags mono"><template x-for="k in list(p.keywords)" :key="k"><span x-text="k"></span></template></p>
              </article>
            </template>
          </div>
        </template>

        <!-- view: skills (skills[]) -->
        <template x-if="s.view === 'skills'">
          <div class="clusters">
            <template x-for="(sk, si) in r.skills" :key="si">
              <figure class="cluster">
                <svg viewBox="-64 -64 128 128" aria-hidden="true" x-html="cluster(sk, si)"></svg>
                <figcaption>
                  <span class="sk-name" x-text="sk.name"></span>
                  <span class="mono lvl" x-text="sk.level"></span>
                  <span class="mono kw" x-text="list(sk.keywords).join(' · ')"></span>
                </figcaption>
              </figure>
            </template>
          </div>
        </template>

        <!-- view: education (education[] + certificates[]) -->
        <template x-if="s.view === 'education'">
          <div>
            <template x-for="(e, i) in r.education" :key="i">
              <article class="entry reveal" data-ink>
                <p class="meta mono">
                  <span x-text="range(e)"></span>
                  <span x-show="e.score" x-text="`grade: ${String(e.score).toLowerCase()}`"></span>
                </p>
                <h3 x-text="degree(e)"></h3>
                <p class="org">
                  <template x-if="e.url"><a :href="e.url" target="_blank" rel="noopener" x-text="e.institution"></a></template>
                  <template x-if="!e.url"><span x-text="e.institution"></span></template>
                </p>
                <ul class="hl" x-show="list(e.courses).length">
                  <template x-for="(c, k) in list(e.courses)" :key="k"><li x-text="c"></li></template>
                </ul>
              </article>
            </template>
            <template x-for="(c, i) in r.certificates" :key="`c${i}`">
              <article class="entry reveal" data-ink>
                <p class="meta mono">
                  <span>certificates[]</span>
                  <span x-show="c.date" x-text="fmt(c.date)"></span>
                  <span x-show="c.issuer" x-text="c.issuer"></span>
                </p>
                <h3>
                  <template x-if="c.url"><a :href="c.url" target="_blank" rel="noopener" x-text="c.name"></a></template>
                  <template x-if="!c.url"><span x-text="c.name"></span></template>
                </h3>
                <p class="sum" x-show="c.summary" x-text="c.summary"></p>
              </article>
            </template>
          </div>
        </template>
      </section>
    </template>

    <!-- LANDMARK: sign-off (hash route #contact) -->
    <footer id="contact" class="sec foot" data-section>
      <header class="sec-head" data-ink>
        <p class="key mono">basics.email</p>
        <h2 x-anchor="'contact'"><span>That's the story so far</span></h2>
      </header>
      <p class="sum">Still writing it. Got a chapter in mind?</p>
      <p class="contact mono">
        <a x-show="r.basics.email" :href="`mailto:${r.basics.email}`" x-text="r.basics.email"></a>
        <template x-for="p in r.basics.profiles" :key="p.url"><a :href="p.url" target="_blank" rel="noopener" x-text="p.network"></a></template>
        <a x-show="r.basics.resumeUrl" :href="r.basics.resumeUrl" target="_blank" rel="noopener">Resume / CV</a>
      </p>
      <div class="sig" data-ink="signature" x-html="signatureSvg"></div>
      <p class="credit mono">built from <a href="resume.json">resume.json</a> · <span x-text="year"></span></p>
    </footer>
  </main>

  <button class="theme-btn" type="button" x-cloak @click="$store.theme.toggle($event)"
          :aria-label="$store.theme.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          :title="$store.theme.theme === 'dark' ? 'Lights on' : 'Lights off'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <mask id="theme-bite"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="bite" cx="16.5" cy="7.5" r="6.4" fill="#000"/></mask>
      <circle class="orb" cx="12" cy="12" r="7.6" fill="currentColor" stroke="none" mask="url(#theme-bite)"/>
      <g class="rays"><path d="M12 2.6v1.8M12 19.6v1.8M2.6 12h1.8M19.6 12h1.8M5.4 5.4l1.3 1.3M17.3 17.3l1.3 1.3M5.4 18.6l1.3-1.3M17.3 6.7l1.3-1.3"/></g>
    </svg>
  </button>

  <!-- Ctrl/⌘+K command palette (commands: js/ui/commands.js) -->
  <div x-data="palette" @keydown.window="onKey($event)" x-effect="document.documentElement.classList.toggle('palette-open', isOpen)">
    <button class="chip mono" type="button" x-cloak x-show="ready && !isOpen" x-transition.opacity @click="show()" x-text="chip" aria-label="Open command palette"></button>

    <div class="pal-wrap" x-cloak x-show="isOpen" x-transition.opacity @click.self="hide()">
      <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
        <input x-ref="q" x-model="query" @input="index = 0" class="mono" type="text" autocomplete="off" spellcheck="false"
               placeholder="Where to? Try “email” or “skills”" aria-label="Search commands"
               @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.enter.prevent="run(results[index])">
        <ul x-ref="list" role="listbox">
          <template x-for="(it, k) in results" :key="it.id">
            <li role="option" :aria-selected="k === index" :class="{ on: k === index }" @mouseenter="index = k" @click="run(it)">
              <span x-text="it.label"></span><span class="mono hintk" x-text="it.hint"></span>
            </li>
          </template>
          <li class="empty" x-show="!results.length">Nothing matches. The pen ran dry.</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="toast-wrap" aria-live="polite">
    <div class="toast mono" x-cloak x-show="$store.toast.message" x-transition.opacity x-text="$store.toast.message"></div>
  </div>
</body>
</html>
